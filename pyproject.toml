[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acute-pancreatitis-bundle-engine"
version = "2.1.0"
description = "Acute pancreatitis severity and supportive-care calculators"
readme = "README.md"
authors = [{ name = "Abu Suraih Sakhri" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pancreatitis-bundle = "cli:main"
acute-pancreatitis-bundle-engine = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/acute-pancreatitis-bundle-agent"
Repository = "https://github.com/abusuraihsakhri/acute-pancreatitis-bundle-agent.git"

[tool.setuptools]
py-modules = ["cli", "pancreatitis_severity"]

[tool.setuptools.packages.find]
include = ["acute_pancreatitis_bundle_agent*"]
