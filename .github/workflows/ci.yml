name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" build

      - name: Run tests
        run: python -m pytest -q

      - name: Check installed CLI
        run: |
          pancreatitis-bundle --evaluate --patient-id PT-CI --bun 32 --cr 2.5 --json > /tmp/result.json
          python - <<'PY'
          import json
          with open('/tmp/result.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['patient_id'] == 'PT-CI'
          assert 'atlanta_classification' in result
          PY

      - name: Batch smoke test
        run: python cli.py --batch sample.csv --json > /tmp/batch.json

      - name: Build distribution
        run: python -m build

      - name: Verify dependency consistency
        run: python -m pip check
